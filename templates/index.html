<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eco 1 AI</title>


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="container">


    <!-- ================================= -->
    <!-- SIDEBAR -->
    <!-- ================================= -->

    <div class="sidebar">

        <h2>🤖 Eco 1</h2>

        <p>
            Your Personal AI Assistant
        </p>


        <button
            class="new-chat"
            onclick="newChat()"
        >
            + New Chat
        </button>

    </div>



    <!-- ================================= -->
    <!-- CHAT AREA -->
    <!-- ================================= -->

    <div class="chat-area">


        <!-- HEADER -->

        <div class="header">

            <div class="logo">

                <div class="circle">
                    E
                </div>


                <div>

                    <h3>
                        Eco 1 AI
                    </h3>

                    <span>
                        Online
                    </span>

                </div>

            </div>

        </div>



        <!-- ================================= -->
        <!-- CHAT BOX -->
        <!-- ================================= -->

        <div
            id="chatbox"
            class="chatbox"
        >


            <!-- Initial AI Message -->

            <div class="bot-message">

                <div class="avatar">
                    🤖
                </div>


                <div class="message">

                    <h3>Hello! 👋</h3>

                    <p>
                        I'm <b>Eco 1</b>.
                    </p>

                    <p>
                        Ask me anything.
                    </p>

                </div>

            </div>

        </div>



        <!-- ================================= -->
        <!-- INPUT AREA -->
        <!-- ================================= -->

        <div class="input-area">


            <input
                type="text"
                id="message"
                placeholder="Message Eco 1..."
                autocomplete="off"
            >


            <button
                onclick="sendMessage()"
                title="Send message"
            >
                ➤
            </button>


        </div>


    </div>


</div>



<!-- ================================= -->
<!-- MARKED.JS -->
<!-- Markdown → HTML -->
<!-- ================================= -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>



<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script
    src="{{ url_for('static', filename='js/script.js') }}"
></script>


</body>

</html>
